name: Deploy Commands

on:
    push:
        branches:
            - master
    workflow_dispatch:
        inputs:
            bump:
                description: Version bump if this commit has not been released yet (auto reads the PR labels)
                type: choice
                options:
                    - auto
                    - patch
                    - minor
                    - major
                default: auto

# Serializes releases, so two merges can never be given the same version.
concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

jobs:
    test:
        uses: ./.github/workflows/test.yml

    release:
        name: Release
        needs: test
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        environment: Production
        permissions:
            contents: write
        outputs:
            version: ${{ steps.version.outputs.version }}
        env:
            AWS_ACCESS_KEY_ID: ${{ vars.CLOUDFLARE_R2_CDN_ID }}
            AWS_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_CDN_SECRET }}
            AWS_DEFAULT_REGION: auto
            CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
            CLOUDFLARE_R2_CDN_BUCKET: ${{ vars.CLOUDFLARE_R2_CDN_BUCKET }}
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
        steps:
            # Checked out as the bot so the tag push below runs as an account
            # the release-tag ruleset exempts. GitHub rejects the Actions app
            # as a bypass actor, so GITHUB_TOKEN cannot create a protected tag.
            - name: Checkout
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  token: ${{ secrets.SUPPLYCART_BOT_TOKEN }}

            - name: Resolve version
              id: version
              env:
                  BUMP_INPUT: ${{ inputs.bump }}
              run: |
                  source .github/scripts/release.sh

                  version=$(existing_release_for "$GITHUB_SHA")
                  if [[ -n "$version" ]]; then
                    echo "$GITHUB_SHA was already tagged $version by an earlier run; resuming."
                    echo "reuse=true" >> "$GITHUB_OUTPUT"
                  else
                    if [[ -n "$BUMP_INPUT" && "$BUMP_INPUT" != "auto" ]]; then
                      part="$BUMP_INPUT"
                    else
                      part=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                        --jq '.[0].labels[]?.name' | bump_from_labels)
                    fi
                    version=$(bump_version "$(latest_release_tag)" "$part")
                    echo "Releasing $GITHUB_SHA as $version ($part bump)."
                    echo "reuse=false" >> "$GITHUB_OUTPUT"
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"

            # The tag must be protected from the moment it exists, so refuse to
            # create one unless an active tag ruleset covers v*.*.*.
            - name: Verify release tags are protected
              run: |
                  for id in $(gh api "repos/$GITHUB_REPOSITORY/rulesets?targets=tag" \
                      --jq '.[] | select(.enforcement == "active") | .id'); do
                    match=$(gh api "repos/$GITHUB_REPOSITORY/rulesets/$id" --jq '
                      select((.conditions.ref_name.include | index("refs/tags/v*.*.*"))
                        and ([.rules[].type] | index("creation") and index("update") and index("deletion")))
                      | .name')
                    if [[ -n "$match" ]]; then
                      echo "Release tags are protected by ruleset '$match' ($id)."
                      exit 0
                    fi
                  done
                  echo "::error::No active tag ruleset blocks creating, updating and deleting refs/tags/v*.*.*. Create one under Settings → Rules → Rulesets first."
                  exit 1

            - name: Create release tag
              if: steps.version.outputs.reuse == 'false'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
                  BOT_TOKEN: ${{ secrets.SUPPLYCART_BOT_TOKEN }}
              run: |
                  if [[ -z "$BOT_TOKEN" ]]; then
                    echo "::error::SUPPLYCART_BOT_TOKEN is not available to this repository, and it is what pushes release tags."
                    exit 1
                  fi

                  source .github/scripts/release.sh
                  stamp_version ssm.sh "$VERSION"
                  stamp_version ssm.ps1 "$VERSION"

                  git config user.name "supplycart-bot"
                  git config user.email "adam+bot@supplycart.my"
                  git commit -am "Release $VERSION" -m "Source: $GITHUB_SHA"
                  git tag -a "$VERSION" -m "$VERSION"
                  # Only the tag is pushed: the release commit never lands on master.
                  git push origin "refs/tags/$VERSION"

            - name: Check out existing release tag
              if: steps.version.outputs.reuse == 'true'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: git checkout --detach "refs/tags/$VERSION"

            # The versioned copy goes up first, so the latest never serves a
            # version that has no copy of its own. The scripts lived directly
            # under shells/ until v1.1.0, and installs from then still run
            # `ssm update` against shells/ssm.sh, so the latest is mirrored
            # there too; their next update moves them to the new URL.
            - name: Upload to R2
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  endpoint="https://$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com"
                  bucket="s3://$CLOUDFLARE_R2_CDN_BUCKET"
                  prefix="shells/aws-ssm-manager"

                  # Copy each release made under the old shells/vX.Y.Z/ layout into
                  # the new one, skipping versions already copied. Nothing is
                  # uploaded to the old versioned paths any more, so after the
                  # first run this finds nothing left to do.
                  old_versions=$(aws s3 ls "$bucket/shells/" --endpoint-url "$endpoint" |
                    awk '$1 == "PRE" && $2 ~ /^v[0-9]+\.[0-9]+\.[0-9]+\/$/ { sub(/\/$/, "", $2); print $2 }')
                  for old in $old_versions; do
                    if ! aws s3 ls "$bucket/$prefix/$old/ssm.sh" --endpoint-url "$endpoint" >/dev/null; then
                      for file in ssm.sh install.sh; do
                        aws s3 cp "$bucket/shells/$old/$file" "$bucket/$prefix/$old/$file" \
                          --endpoint-url "$endpoint"
                      done
                    fi
                  done

                  # Defined after the backfill loop above on purpose: that loop
                  # copies pre-v1.1.0 releases, which only ever held the two
                  # bash files, and must keep its own two-file list.
                  release_files="ssm.sh install.sh ssm.ps1 install.ps1"

                  for dest in "$prefix/$VERSION" "$prefix"; do
                    for file in $release_files; do
                      # Without an explicit type R2 stores .ps1 as
                      # octet-stream, and Invoke-RestMethod hands `iex` a
                      # byte[] for that, which it cannot execute. ssm.cmd is
                      # not here at all: install.ps1 writes it locally, because
                      # cmd.exe is unforgiving about line endings and a BOM.
                      case "$file" in
                        *.ps1)
                          aws s3 cp "$file" "$bucket/$dest/$file" \
                            --endpoint-url "$endpoint" \
                            --content-type "text/plain; charset=utf-8" ;;
                        *)
                          aws s3 cp "$file" "$bucket/$dest/$file" \
                            --endpoint-url "$endpoint" ;;
                      esac
                    done
                  done

                  # The legacy shells/ mirror is frozen at the two macOS files.
                  # It exists only for installs from before v1.1.0, and there
                  # has never been a Windows release that could read from it.
                  for file in ssm.sh install.sh; do
                    aws s3 cp "$file" "$bucket/shells/$file" --endpoint-url "$endpoint"
                  done

            - name: Publish GitHub release
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if gh release view "$VERSION" >/dev/null 2>&1; then
                    echo "Release $VERSION already exists."
                    exit 0
                  fi
                  gh release create "$VERSION" ssm.sh install.sh ssm.ps1 install.ps1 \
                    --verify-tag --title "$VERSION" --generate-notes

    # Installs the release just uploaded, from the CDN, with the documented
    # one-liner under Windows PowerShell 5.1 and 7. It runs after the upload,
    # so it cannot stop a bad release -- the PR run of the same workflow is
    # what does that -- but it does catch what only the CDN can break, such
    # as a content type.
    windows-install:
        name: Windows install
        needs: release
        uses: ./.github/workflows/install-windows.yml
        with:
            version: ${{ needs.release.outputs.version }}
